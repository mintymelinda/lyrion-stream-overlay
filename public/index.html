<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lyrion Stream Overlay</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="overlay" class="overlay" aria-live="polite">
    <div class="artwork-wrap">
      <img id="artwork" class="artwork" alt="Album artwork" src="/placeholder.svg">
    </div>
    <section class="details">
      <div id="title" class="title">Waiting for player…</div>
      <div id="artist" class="artist"></div>
      <div class="progress">
        <div class="time-row">
          <time id="elapsed">0:00</time>
          <time id="remaining">-0:00</time>
        </div>
        <div class="track"><div id="progress-fill" class="track-fill"></div></div>
      </div>
    </section>
    <div id="error" class="error" hidden></div>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
