services:
  lyrion-stream-overlay:
    build: .
    image: lyrion-stream-overlay:latest
    container_name: lyrion-stream-overlay
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8080}:8080"
    # UDP broadcast discovery needs LAN access. On Linux, host networking is
    # the most reliable option; remove ports when enabling network_mode: host.
    # network_mode: host
